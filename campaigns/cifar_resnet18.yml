name: cifar_tensor_logits
dataset: { kind: cifar10, split: test, batch_size: 64 }
model:   { kind: ResNet18, weights: out/cifar_resnet18.pt }
inject:
  enabled: true
  p: 0.3
  bit_width: 32
  target_layers: ["Linear[-1]"]   # classifier layer (logits)
trials:  { max: 471, seed_base: 50000 }
logging: { path: out/runs_cifar_logits.jsonl, validate: true }
resume:  true
