name: mnist_linear0_strong
dataset: { kind: mnist, split: test, batch_size: 64 }
model:   { kind: SmallCNN, weights: out/mnist_smallcnn.pt }
inject:
  enabled: true
  p: 1.0
  bit_width: 32
  target_layers: ["Linear[0]"]   # the 128-dense layer before logits
trials:  { max: 600, seed_base: 62000 }
logging: { path: out/runs_mnist_linear0_strong.jsonl, validate: true }
resume:  false
