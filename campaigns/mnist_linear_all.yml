name: mnist_tensor_linear_all
dataset: { kind: mnist, split: test, batch_size: 64 }
model:   { kind: SmallCNN, weights: out/mnist_smallcnn.pt }
inject:
  enabled: true
  p: 1.0e-6
  bit_width: 32
  target_layers: ["Linear"]   # all Linear layers
trials:  { max: 300, seed_base: 30000 }
logging: { path: out/runs_mnist_linear_all.jsonl, validate: true }
resume:  true
