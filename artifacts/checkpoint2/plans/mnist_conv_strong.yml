name: mnist_conv_strong
dataset: { kind: mnist, split: test, batch_size: 64 }
model:   { kind: SmallCNN, weights: out/mnist_smallcnn.pt }
inject:
  enabled: true
  p: 1.0             # flip every forward pass
  bit_width: 32
  target_layers: ["Conv2d"]   # earlier layers → bigger effect
trials:  { max: 600, seed_base: 60000 }
logging: { path: out/runs_mnist_conv_strong.jsonl, validate: true }
resume:  false
