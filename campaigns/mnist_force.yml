name: mnist_force
dataset: { kind: mnist, split: test, batch_size: 64 }
model:   { kind: SmallCNN, weights: out/mnist_smallcnn.pt }
inject:
  enabled: true
  p: 1.0            # always inject
  bit_width: 32
  target_layers: ["Linear[-1]"]
trials:  { max: 500, seed_base: 80000 }
logging: { path: out/runs_mnist_force.jsonl, validate: true }
resume:  false
