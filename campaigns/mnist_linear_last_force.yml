name: force_flip_smoke
dataset: { kind: mnist, split: test, batch_size: 64 }
model:   { kind: SmallCNN, weights: out/mnist_smallcnn.pt }
inject:
  enabled: true
  p: 1.0
  bit_width: 32
  target_layers: ["Linear[-1]"]
trials:  { max: 1, seed_base: 12345 }   # one batch is enough for the smoke test
logging: { path: out/ignore.jsonl, validate: false }
eval:    { mode: margin, delta: 0.15 }
resume:  false
