name: mnist_conv_all
dataset: { kind: mnist, split: test, batch_size: 64 }
model:   { kind: SmallCNN, weights: out/mnist_smallcnn.pt }
inject:
  enabled: true
  p: 1.0e-2
  bit_width: 32
  target_layers: ["Conv2d"]    # all convs
trials:  { max: 500, seed_base: 41000 }
logging: { path: out/runs_mnist_conv.jsonl, validate: true }
resume:  false
